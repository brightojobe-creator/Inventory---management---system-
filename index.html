<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supermarket Inventory Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container"><span class="navbar-brand">Supermarket Inventory</span><button id="logoutBtn" class="btn btn-outline-light d-none">Logout</button></div>
</nav>

<main class="container py-4">
  <div id="alert"></div>

  <section id="authView" class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="mb-3">Login</h3>
          <form id="loginForm">
            <input id="loginEmail" class="form-control mb-2" type="email" placeholder="Email" required>
            <input id="loginPassword" class="form-control mb-3" type="password" placeholder="Password" required>
            <button class="btn btn-primary w-100">Login</button>
          </form>
          <hr>
          <p class="mb-0">New user? <button id="showRegister" class="btn btn-link p-0">Create account</button></p>
        </div>
      </div>
    </div>
  </section>

  <section id="registerView" class="row justify-content-center d-none">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3>Create Account</h3>
          <form id="registerForm">
            <input id="regName" class="form-control mb-2" placeholder="Full name" required>
            <input id="regEmail" class="form-control mb-2" type="email" placeholder="Email" required>
            <input id="regPassword" class="form-control mb-3" type="password" minlength="6" placeholder="Password (min 6 characters)" required>
            <button class="btn btn-success w-100">Register</button>
          </form>
          <p class="mt-3">Already registered? <button id="showLogin" class="btn btn-link p-0">Login</button></p>
        </div>
      </div>
    </div>
  </section>

  <section id="appView" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div><h2>Dashboard</h2><p id="welcome" class="text-muted"></p></div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openProductModal()">Add Product</button>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg"><div class="stat card"><span>Products</span><strong id="statProducts">0</strong></div></div>
      <div class="col-6 col-lg"><div class="stat card"><span>Categories</span><strong id="statCategories">0</strong></div></div>
      <div class="col-6 col-lg"><div class="stat card"><span>Suppliers</span><strong id="statSuppliers">0</strong></div></div>
      <div class="col-6 col-lg"><div class="stat card"><span>Total Stock</span><strong id="statStock">0</strong></div></div>
      <div class="col-12 col-lg"><div class="stat card"><span>Low Stock</span><strong id="statLow">0</strong></div></div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-8"><input id="search" class="form-control" placeholder="Search by product name or SKU"></div>
          <div class="col-md-4"><select id="categoryFilter" class="form-select"><option value="">All categories</option></select></div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h4>Products</h4>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Supplier</th><th>Actions</th></tr></thead>
            <tbody id="productsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <form id="productForm">
      <div class="modal-header"><h5 class="modal-title" id="productModalTitle">Add Product</h5><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div>
      <div class="modal-body">
        <input type="hidden" id="productId">
        <input id="pName" class="form-control mb-2" placeholder="Product name" required>
        <input id="pSku" class="form-control mb-2" placeholder="SKU" required>
        <div class="row g-2">
          <div class="col-6"><input id="pPrice" class="form-control mb-2" type="number" min="0" step="0.01" placeholder="Price" required></div>
          <div class="col-6"><input id="pQuantity" class="form-control mb-2" type="number" min="0" placeholder="Quantity" required></div>
          <div class="col-6"><input id="pReorder" class="form-control mb-2" type="number" min="0" value="5" placeholder="Reorder level" required></div>
          <div class="col-6"><select id="pCategory" class="form-select mb-2" required></select></div>
          <div class="col-12"><select id="pSupplier" class="form-select" required></select></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary">Save Product</button></div>
    </form>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
